<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Aanbod beheren — The Black Pearl</title><link rel="icon" href="assets/mark.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="beheer.css"><body><main class="admin"><a href="index.html">← Website</a><h1>Aanbod beheren</h1><p id="notice" role="status"></p><form id="login"><label>E-mailadres<input type="email" id="email" required autocomplete="username"></label><label>Wachtwoord<input type="password" id="password" required autocomplete="current-password"></label><button>Inloggen</button></form><section id="workspace" hidden><button id="logout">Uitloggen</button><button id="new">Nieuwe auto</button><div id="list"></div><form id="editor"><h2>Autogegevens</h2><div id="fields"></div><label>Beschrijving<textarea name="description" rows="6"></textarea></label><label>Opties (één per regel)<textarea name="options" rows="5"></textarea></label><label>Status<select name="status"><option>Te koop</option><option>Gereserveerd</option><option>Verkocht</option></select></label><label><input type="checkbox" name="published"> Publiceren op website</label><h3>Foto’s</h3><p>De eerste foto is de hoofdfoto. Verplaats met de pijlen. Maximaal 10 MB per foto.</p><input id="uploads" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="photos"></div><button id="save">Opslaan</button><p>Om een auto te verwijderen uit het aanbod: zet Publiceren uit en sla op.</p></form></section></main><script type="module" src="beheer.js"></script></body></html>
